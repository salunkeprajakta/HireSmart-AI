<!DOCTYPE html>
<html>
<head>
    <title>HireSmart AI - Login</title>
</head>

<body>

    <h1>HireSmart AI</h1>

    <h2>Login</h2>

    <form action="{{ url_for('login') }}" method="POST">

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
