<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireSmart AI - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>HireSmart AI</h1>

        <h2>Login</h2>

        <form action="/login" method="POST">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p>
            <a href="/forgot-password">
                Forgot Password?
            </a>
        </p>

        <p>
            <a href="/register">
                Don't have an account? Register
            </a>
        </p>

    </div>

</body>
</html>
