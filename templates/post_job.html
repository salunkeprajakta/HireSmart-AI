<!DOCTYPE html>
<html>
<head>
    <title>Post New Job - HireSmart AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
        }

        .navbar {
            background: #1f3c88;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1f3c88;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f3c88;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>HireSmart AI</h2>
    <a href="/logout">Logout</a>
</div>

<div class="container">

    <div class="card">

        <h1>📢 Post New Job</h1>

        <form method="POST">

            <label>Job Title *</label>
            <input
                type="text"
                name="title"
                placeholder="Example: Python Developer"
                required
            >

            <label>Company *</label>
            <input
                type="text"
                name="company"
                placeholder="Example: ABC Technologies"
                required
            >

            <label>Location *</label>
            <input
                type="text"
                name="location"
                placeholder="Example: Pune"
                required
            >

            <label>Required Skills *</label>
            <input
                type="text"
                name="skills"
                placeholder="Example: Python, Flask, SQL"
                required
            >

            <label>Job Description</label>
            <textarea
                name="description"
                placeholder="Enter job description..."
            ></textarea>

            <button type="submit">
                📢 Post Job
            </button>

        </form>

        <a class="back" href="/recruiter/dashboard">
            ← Back to Recruiter Dashboard
        </a>

    </div>

</div>

</body>
</html>
