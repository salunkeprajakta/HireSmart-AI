<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Start AI Interview - HireSmart AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .interview-container {
            max-width: 850px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .interview-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        .option-section {
            margin-bottom: 30px;
        }

        .option-section h3 {
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .option {
            flex: 1;
            min-width: 130px;
        }

        .option input {
            display: none;
        }

        .option label {
            display: block;
            padding: 16px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            background: #fafafa;
            transition: 0.2s;
        }

        .option input:checked + label {
            border-color: #007bff;
            background: #eaf3ff;
            color: #007bff;
            font-weight: bold;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #007bff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover {
            background: #005fcc;
        }

        .resume-note {
            margin-top: 25px;
            padding: 15px;
            background: #f5f7fb;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="interview-container">

    <h1>🎤 AI-Powered Interview</h1>

    <p class="subtitle">
        Configure your interview before starting
    </p>

    <form method="POST">

        <!-- Question Count -->
        <div class="option-section">

            <h3>📝 Number of Questions</h3>

            <div class="options">

                <div class="option">
                    <input
                        type="radio"
                        id="q10"
                        name="question_count"
                        value="10"
                        checked>
                    <label for="q10">10 Questions</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="q20"
                        name="question_count"
                        value="20">
                    <label for="q20">20 Questions</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="q30"
                        name="question_count"
                        value="30">
                    <label for="q30">30 Questions</label>
                </div>

            </div>
        </div>


        <!-- Interview Duration -->
        <div class="option-section">

            <h3>⏱️ Interview Duration</h3>

            <div class="options">

                <div class="option">
                    <input
                        type="radio"
                        id="time15"
                        name="duration"
                        value="15">
                    <label for="time15">15 Minutes</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="time20"
                        name="duration"
                        value="20">
                    <label for="time20">20 Minutes</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="time30"
                        name="duration"
                        value="30"
                        checked>
                    <label for="time30">30 Minutes</label>
                </div>

            </div>
        </div>


        <!-- Interview Type -->
        <div class="option-section">

            <h3>🎯 Interview Type</h3>

            <div class="options">

                <div class="option">
                    <input
                        type="radio"
                        id="hr"
                        name="interview_type"
                        value="hr"
                        checked>
                    <label for="hr">👔 HR Interview</label>
                </div>

                <div class="option">
                    <input
                        type="radio"
                        id="technical"
                        name="interview_type"
                        value="technical">
                    <label for="technical">💻 Technical Interview</label>
                </div>

            </div>
        </div>


        <div class="resume-note">
            📄 Interview questions will be generated based on your
            uploaded resume and follow-up questions will consider
            your previous answers.
        </div>

        <br>

        <button type="submit" class="start-btn">
            🚀 Start Interview
        </button>

    </form>

</div>

</body>
</html>
