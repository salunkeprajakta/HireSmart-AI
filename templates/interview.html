<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Interview - HireSmart AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="interview-navbar">

        <h2>HireSmart AI</h2>

        <a href="/logout">Logout</a>

    </div>

    <div class="interview-container">

        <div class="interview-card">

            <div class="interview-icon">
                🤖
            </div>

            <h1>
                AI Resume-Based Interview
            </h1>

            {% if resume %}
            <p class="resume-info">
                Resume detected:
                <strong>{{ resume }}</strong>
            </p>
            {% endif %}

            <p class="interview-description">
                Gemini AI will analyze your uploaded resume
                and generate personalized interview questions.
            </p>

            <form method="POST">

                <button type="submit" class="interview-button">
                    🚀 Start Resume Interview
                </button>

            </form>

            {% if error %}

            <div class="interview-error">
                ⚠️ {{ error }}
            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
